name: CI Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies cleanly
        run: npm ci --ignore-scripts

      - name: Test integrity check (protected suites)
        run: npm run check:integrity

      - name: Static RLS coverage check
        run: node scripts/check-rls-coverage.mjs

      - name: OpenAPI 3.1 contract check
        run: npm run openapi:generate && git diff --exit-code docs/architecture/openapi.v1.json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit, financial, and security tests
        run: npm test

      - name: Build web frontend
        run: npm run build --workspace=apps/web
