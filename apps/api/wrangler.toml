name = "financial-saas"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*"]

[vars]
APP_ORIGIN = "https://financial-saas.zeeshan-m-personal.workers.dev"
STORAGE_DRIVER = "r2"

# Secrets (COOKIE_SIGNING_SECRET, CSRF_SECRET, SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_JWKS_URL)
# MUST be set via `wrangler secret put` or local `.dev.vars` (override APP_ORIGIN in `.dev.vars` for `wrangler dev`).
# NEVER add SUPABASE_SERVICE_ROLE_KEY to this Worker (AUTHORIZATION_RBAC_RLS.md §4).
